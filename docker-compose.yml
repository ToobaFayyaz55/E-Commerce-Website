services:
  backend:
    image: ghcr.io/toobafayyaz55/fashion-store-backend:latest
    container_name: fashion-store-backend
    env_file:
      - ./backend/.env
    expose:
      - "4000"
    volumes:
      - backend_uploads:/app/upload/images
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    image: ghcr.io/toobafayyaz55/fashion-store-frontend:latest
    container_name: fashion-store-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  backend_uploads:
