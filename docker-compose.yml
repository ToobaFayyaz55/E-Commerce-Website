services:
  backend:
    build: ./backend
    container_name: fashion-store-backend
    env_file:
      - ./backend/.env
    expose:
      - "4000"
    volumes:
      - backend_uploads:/app/upload/images
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: /api
    container_name: fashion-store-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  backend_uploads:
